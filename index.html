<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#bbada0" />
  <title>Eye 2048 - 눈으로 하는 2048</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>👁️ Eye 2048</h1>
    <p class="subtitle">시선을 위/아래/왼쪽/오른쪽으로 움직여 타일을 조작하세요</p>
  </header>

  <main>
    <section class="game-panel">
      <div class="score-row">
        <div class="score-box">
          <span class="label">점수</span>
          <span id="score">0</span>
        </div>
        <div class="score-box">
          <span class="label">최고</span>
          <span id="best">0</span>
        </div>
        <button id="restart" type="button">새 게임</button>
      </div>

      <div id="board" class="board" aria-label="2048 게임 보드"></div>

      <div class="game-msg" id="game-msg" hidden>
        <p id="game-msg-text"></p>
        <button id="msg-restart" type="button">다시 시작</button>
      </div>

      <div class="controls">
        <p>키보드: ← ↑ → ↓ 또는 W A S D</p>
      </div>
    </section>

    <section class="eye-panel">
      <h2>시선 추적</h2>
      <div class="cam-wrap">
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>

      <div class="eye-status">
        <div class="status-row">
          <span class="label">상태</span>
          <span id="tracker-status">비활성</span>
        </div>
        <div class="status-row">
          <span class="label">현재 시선</span>
          <span id="gaze-direction">-</span>
        </div>
        <div class="status-row">
          <span class="label">민감도</span>
          <input id="sensitivity" type="range" min="0.03" max="0.20" step="0.005" value="0.07" />
          <span id="sensitivity-val">0.12</span>
        </div>
        <div class="status-row">
          <span class="label">쿨다운(ms)</span>
          <input id="cooldown" type="range" min="200" max="1500" step="50" value="600" />
          <span id="cooldown-val">600</span>
        </div>
        <div class="status-row">
          <span class="label">방향 반전</span>
          <label class="chk"><input id="invert-x" type="checkbox" /> 좌우</label>
          <label class="chk"><input id="invert-y" type="checkbox" /> 상하</label>
        </div>
      </div>

      <div class="eye-buttons">
        <button id="start-cam" type="button">카메라 시작</button>
        <button id="calibrate" type="button" disabled>중앙 보정</button>
        <button id="stop-cam" type="button" disabled>중지</button>
      </div>

      <p class="hint">
        팁: 카메라가 켜진 뒤 정면을 보고 <strong>중앙 보정</strong>을 누르세요.
        그 다음 시선을 한쪽으로 옮기면 그 방향으로 타일이 이동합니다.
      </p>
    </section>
  </main>

  <script type="module" src="game.js"></script>
  <script type="module" src="eyeTracker.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
